services:
  db:
    image: "mcr.microsoft.com/mssql/server:2025-latest"
    container_name: sql_server
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - sql-server-data:/var/opt/mssql

  web:
    container_name: BookShoppingCartMVC
    build: .
    image: book-shopping-car-mvc:1.0.0
    ports:
      - 8080:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=BookShoppingCartMvc;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  sql-server-data:
    name: sql-data
